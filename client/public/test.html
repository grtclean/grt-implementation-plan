<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<h1>Server is working!</h1>
<div id="result">Testing API...</div>
<script>
fetch('/health').then(r=>r.json()).then(d=>{
  document.getElementById('result').textContent = 'API OK: ' + JSON.stringify(d.status);
}).catch(e=>{
  document.getElementById('result').textContent = 'API FAILED: ' + e.message;
});
</script>
</body>
</html>
