<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>GRT智能系统快速实施方案</title>
    <!-- Prevent flash of incorrect theme and CSS transition flicker during initial load -->
    <script>
      (function() {
        // 1. Disable browser's automatic scroll restoration — it fights with
        //    React's rendering and causes visible content jumping on refresh
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        // 2. Set dark class synchronously to prevent theme flash
        var theme = localStorage.getItem('grt-theme') || 'dark';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var isDark = theme === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        // 3. Set background color on <html> IMMEDIATELY — prevents white flash
        //    between page load and CSS load (Vite CSS isn't available yet)
        document.documentElement.style.backgroundColor = isDark ? '#0b1120' : '#fafafa';
        // 4. Disable all CSS transitions until app signals ready
        document.documentElement.classList.add('no-transitions');
      })();
    </script>
    <style>
      /* Suppress all transitions during initial load to prevent flicker */
      .no-transitions, .no-transitions *, .no-transitions *::before, .no-transitions *::after {
        transition: none !important;
        animation-name: none !important;
      }
      /* Loading overlay — covers page until React app is ready */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        /* !important needed to override .no-transitions * { transition: none !important } */
        transition: opacity 0.3s ease !important;
      }
      .dark #app-loader { background: #0b1120; }
      :root:not(.dark) #app-loader { background: #fafafa; }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid transparent;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.7s linear infinite !important;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=optional" rel="stylesheet">
  </head>

  <body>
    <!-- Loading overlay — removed by main.tsx after React mount -->
    <div id="app-loader"><div class="spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
