<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <title>GRT System — 智能管理系统</title>
    <link rel="icon" type="image/gif" href="/GRTlogo.gif" />
    <link rel="apple-touch-icon" href="/GRTlogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/GRTlogo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0078d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GRT System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GRT System" />
    <!-- Prevent flash of incorrect theme and CSS transition flicker during initial load -->
    <script>
      (function() {
        // 1. Disable browser's automatic scroll restoration — it fights with
        //    React's rendering and causes visible content jumping on refresh
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        // 2. One-time migration: force light theme for Microsoft white-background style
        if (!localStorage.getItem('grt-theme-v2-migrated')) {
          localStorage.setItem('grt-theme', 'light');
          localStorage.setItem('grt-theme-v2-migrated', '1');
        }
        // 3. Set dark class synchronously to prevent theme flash
        var theme = localStorage.getItem('grt-theme') || 'light';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var isDark = theme === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        // 3. Set background color on <html> IMMEDIATELY — prevents white flash
        //    between page load and CSS load (Vite CSS isn't available yet)
        //    MUST match the exact --background values in index.css to avoid
        //    color shift during the loading overlay fade-out
        document.documentElement.style.backgroundColor = isDark ? 'oklch(0.13 0.02 260)' : '#faf9f8';
        // 4. Disable all CSS transitions until app signals ready
        document.documentElement.classList.add('no-transitions');
      })();
    </script>
    <style>
      /* Suppress all transitions during initial load to prevent flicker */
      .no-transitions, .no-transitions *, .no-transitions *::before, .no-transitions *::after {
        transition: none !important;
        animation-name: none !important;
      }
      /* Loading overlay — covers page until React app is ready.
         Removed instantly (no fade) by main.tsx for clean single-frame
         switch that works well on remote desktop connections. */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dark #app-loader { background: oklch(0.13 0.02 260); }
      :root:not(.dark) #app-loader { background: #faf9f8; }
      #app-loader .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid transparent;
        border-top-color: #0078d4;
        border-radius: 50%;
        animation: spin 0.7s linear infinite !important;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* When loader is fading out after timeout, show content underneath */
      #app-loader.removing { opacity: 0; pointer-events: none; }
    </style>
    <!--
      Google Fonts loaded ASYNCHRONOUSLY to prevent render-blocking.
      The media="print" trick loads the CSS without blocking paint,
      then switches to media="all" once loaded. If fonts never load
      (slow CDN, firewall), the page uses system font fallbacks — no
      layout shift because display=optional means no font swap.
    -->
    <!--
      Google Fonts: Use China-accessible mirror (fonts.loli.net) with aggressive timeout.
      Falls back to system fonts if unreachable (display=optional prevents FOIT).
    -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=optional"
      media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=optional">
    </noscript>
  </head>

  <body>
    <!-- ══════════════════════════════════════════════════════════
         微信 WebView 引导页 — 纯 HTML/CSS，零 JS 依赖
         用户扫码后第一时间看到，无需等待任何 bundle 下载
         ══════════════════════════════════════════════════════════ -->
    <div id="wechat-hint" style="display:none">
      <style>
        #wechat-hint {
          position:fixed;inset:0;z-index:999999;
          background:linear-gradient(180deg,#0a0e17 0%,#0d1321 50%,#0a0e17 100%);
          color:#fff;font-family:-apple-system,system-ui,"PingFang SC","Helvetica Neue",sans-serif;
          overflow-y:auto;-webkit-overflow-scrolling:touch;
        }
        #wechat-hint .wh-inner {max-width:360px;margin:0 auto;padding:48px 24px 40px;text-align:center}
        #wechat-hint .wh-logo {width:64px;height:64px;border-radius:16px;margin-bottom:20px}
        #wechat-hint .wh-title {font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-0.5px}
        #wechat-hint .wh-sub {font-size:13px;color:#8b949e;margin:0 0 28px}
        /* 步骤卡片 */
        #wechat-hint .wh-steps {
          background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
          border-radius:16px;padding:20px;margin-bottom:20px;text-align:left;
        }
        #wechat-hint .wh-step-title {font-size:14px;font-weight:600;color:#58a6ff;margin:0 0 16px;text-align:center}
        #wechat-hint .wh-step {display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
        #wechat-hint .wh-step:last-child {margin-bottom:0}
        #wechat-hint .wh-num {
          width:28px;height:28px;border-radius:50%;
          background:linear-gradient(135deg,#0078d4,#00a2ff);
          display:flex;align-items:center;justify-content:center;
          font-size:13px;font-weight:700;flex-shrink:0;
        }
        #wechat-hint .wh-step-text {flex:1;padding-top:3px}
        #wechat-hint .wh-step-text b {font-size:14px;display:block;margin-bottom:2px}
        #wechat-hint .wh-step-text span {font-size:11px;color:#8b949e;line-height:1.4}
        /* 右上角箭头动画 */
        #wechat-hint .wh-arrow {
          position:fixed;top:8px;right:16px;z-index:1000000;
          font-size:32px;animation:wh-bounce 1.5s ease-in-out infinite;
        }
        @keyframes wh-bounce {
          0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}
        }
        /* 按钮 */
        #wechat-hint .wh-btn-primary {
          width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;
          font-size:15px;font-weight:600;font-family:inherit;
          background:linear-gradient(135deg,#0078d4,#00a2ff);color:#fff;
          margin-bottom:10px;
        }
        #wechat-hint .wh-btn-secondary {
          width:100%;padding:10px;border-radius:10px;cursor:pointer;
          font-size:12px;font-family:inherit;
          background:transparent;color:#58a6ff;border:1px solid rgba(255,255,255,0.1);
        }
        #wechat-hint .wh-footer {margin-top:24px;font-size:10px;color:#484f58;line-height:1.5}
      </style>
      <!-- 右上角弹跳箭头 — 指向微信 ··· 菜单 -->
      <div class="wh-arrow">↗️</div>
      <div class="wh-inner">
        <img src="/GRTlogo.gif" alt="GRT" class="wh-logo">
        <h1 class="wh-title">GRT 客户门户</h1>
        <p class="wh-sub">Global Robot Technology · 工业精密清洗</p>

        <!-- 步骤引导 -->
        <div class="wh-steps">
          <div class="wh-step-title">请在浏览器中打开以获得最佳体验</div>
          <div class="wh-step">
            <div class="wh-num">1</div>
            <div class="wh-step-text">
              <b>点击右上角 ···</b>
              <span>点击微信右上角的三个点菜单按钮</span>
            </div>
          </div>
          <div class="wh-step">
            <div class="wh-num">2</div>
            <div class="wh-step-text">
              <b>选择「在浏览器中打开」</b>
              <span>在弹出菜单中找到并点击此选项</span>
            </div>
          </div>
          <div class="wh-step">
            <div class="wh-num">3</div>
            <div class="wh-step-text">
              <b>填写信息即可进入系统</b>
              <span>输入手机号和公司名称，30秒完成注册</span>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <button id="wechat-copy-url" class="wh-btn-primary">
          📋 复制链接到浏览器打开
        </button>
        <button id="wechat-continue" class="wh-btn-secondary">
          继续在微信中使用（加载可能较慢）
        </button>

        <div class="wh-footer">
          GRT · 全球机器人科技 · 杰瑞德自动化<br>
          无锡 · 斯图加特 · 底特律
        </div>
      </div>
    </div>
    <script>
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var isWechat = ua.indexOf('micromessenger') > -1;
        // 也检测企业微信、QQ内置浏览器
        var isRestricted = isWechat || ua.indexOf('wxwork') > -1 || ua.indexOf(' qq/') > -1;
        if (isRestricted) {
          var hint = document.getElementById('wechat-hint');
          if (hint) hint.style.display = 'block';

          // 复制链接按钮
          var copyBtn = document.getElementById('wechat-copy-url');
          if (copyBtn) copyBtn.onclick = function() {
            var url = location.href;
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                  copyBtn.innerHTML = '✅ 链接已复制！请打开手机浏览器粘贴访问';
                  copyBtn.style.background = '#16a34a';
                });
              } else { throw 0; }
            } catch(e) {
              var t = document.createElement('textarea');
              t.value = url;
              t.style.cssText = 'position:fixed;left:-9999px';
              document.body.appendChild(t);
              t.select();
              try { document.execCommand('copy'); } catch(ex) {}
              document.body.removeChild(t);
              copyBtn.innerHTML = '✅ 链接已复制！请打开手机浏览器粘贴访问';
              copyBtn.style.background = '#16a34a';
            }
          };

          // 继续使用按钮
          var contBtn = document.getElementById('wechat-continue');
          if (contBtn) contBtn.onclick = function() {
            contBtn.innerHTML = '加载中...';
            contBtn.style.color = '#8b949e';
            contBtn.disabled = true;
            setTimeout(function() { hint.style.display = 'none'; }, 500);
          };
        }
      })();
    </script>
    <!-- Loading overlay — removed by main.tsx after React mount -->
    <div id="app-loader">
      <div style="text-align:center">
        <img src="/GRTlogo.gif" alt="GRT" width="48" height="48" style="margin-bottom:12px">
        <div class="spinner"></div>
        <div style="margin-top:12px;font-size:12px;color:#888;font-family:system-ui" id="loader-text">GRT System</div>
        <div id="loader-slow" style="display:none;margin-top:16px;font-size:11px;color:#666;font-family:system-ui;max-width:260px;line-height:1.5">
          正在加载，请稍候...<br>
          <span style="font-size:10px;color:#999">Loading resources...</span>
        </div>
        <div id="loader-retry" style="display:none;margin-top:16px;text-align:center">
          <div style="font-size:11px;color:#e44;font-family:system-ui;margin-bottom:8px">加载较慢，请尝试刷新</div>
          <button onclick="location.reload()" style="padding:8px 24px;border-radius:6px;background:#0078d4;color:#fff;border:none;font-size:13px;cursor:pointer;font-family:system-ui">
            点击重试
          </button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <!-- Progressive loading feedback + safety fallback -->
    <script>
      // Show "loading" hint after 3s
      setTimeout(function() {
        var s = document.getElementById('loader-slow');
        if (s) s.style.display = 'block';
      }, 3000);
      // Show retry button after 8s
      setTimeout(function() {
        var r = document.getElementById('loader-retry');
        if (r) r.style.display = 'block';
      }, 8000);
      // Safety: remove overlay after 8s regardless
      setTimeout(function() {
        var loader = document.getElementById('app-loader');
        if (loader) loader.remove();
        document.documentElement.classList.remove('no-transitions');
      }, 8000);
    </script>
    <!-- Entry point selection: customer pages get ultra-light entry (no tRPC/providers) -->
    <script>
      (function() {
        var p = location.pathname.replace(/\/$/, '') || '/';
        if (p === '/customer/auth' || p === '/customer/forum' || p === '/customer-workspace' || p === '/customer/portal') {
          window.__GRT_CUSTOMER_FAST = true;
        }
        if (p.indexOf('/showcase/') === 0 || p.indexOf('/showroom') === 0) {
          window.__GRT_SKIP_AUTH_FETCH = true;
        }
      })();
    </script>
    <script type="module" src="./src/entry-router.ts"></script>
    <!-- Analytics loaded AFTER page load event so it doesn't keep the
         browser loading indicator spinning (which causes perceived "jumping") -->
    <script>
      window.addEventListener('load', function() {
        var ep = '%VITE_ANALYTICS_ENDPOINT%';
        var id = '%VITE_ANALYTICS_WEBSITE_ID%';
        if (ep && id && ep.charAt(0) !== '%') {
          var s = document.createElement('script');
          s.src = ep + '/umami';
          s.dataset.websiteId = id;
          s.async = true;
          document.body.appendChild(s);
        }
        // Register Service Worker for PWA offline support
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        }
      });
    </script>
  </body>

</html>
