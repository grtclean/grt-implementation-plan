<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>GRT System — 智能管理系统</title>
    <link rel="icon" type="image/gif" href="/GRTlogo.gif" />
    <link rel="apple-touch-icon" href="/GRTlogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/GRTlogo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0078d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GRT System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="GRT System" />
    <!-- Prevent flash of incorrect theme and CSS transition flicker during initial load -->
    <script>
      (function() {
        // 1. Disable browser's automatic scroll restoration — it fights with
        //    React's rendering and causes visible content jumping on refresh
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        // 2. One-time migration: force light theme for Microsoft white-background style
        if (!localStorage.getItem('grt-theme-v2-migrated')) {
          localStorage.setItem('grt-theme', 'light');
          localStorage.setItem('grt-theme-v2-migrated', '1');
        }
        // 3. Set dark class synchronously to prevent theme flash
        var theme = localStorage.getItem('grt-theme') || 'light';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var isDark = theme === 'dark';
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        // 3. Set background color on <html> IMMEDIATELY — prevents white flash
        //    between page load and CSS load (Vite CSS isn't available yet)
        //    MUST match the exact --background values in index.css to avoid
        //    color shift during the loading overlay fade-out
        document.documentElement.style.backgroundColor = isDark ? 'oklch(0.13 0.02 260)' : '#faf9f8';
        // 4. Disable all CSS transitions until app signals ready
        document.documentElement.classList.add('no-transitions');
      })();
    </script>
    <style>
      /* Suppress all transitions during initial load to prevent flicker */
      .no-transitions, .no-transitions *, .no-transitions *::before, .no-transitions *::after {
        transition: none !important;
        animation-name: none !important;
      }
      /* Loading overlay — covers page until React app is ready.
         Removed instantly (no fade) by main.tsx for clean single-frame
         switch that works well on remote desktop connections. */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dark #app-loader { background: oklch(0.13 0.02 260); }
      :root:not(.dark) #app-loader { background: #faf9f8; }
      #app-loader .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid transparent;
        border-top-color: #0078d4;
        border-radius: 50%;
        animation: spin 0.7s linear infinite !important;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* When loader is fading out after timeout, show content underneath */
      #app-loader.removing { opacity: 0; pointer-events: none; }
    </style>
    <!--
      Google Fonts loaded ASYNCHRONOUSLY to prevent render-blocking.
      The media="print" trick loads the CSS without blocking paint,
      then switches to media="all" once loaded. If fonts never load
      (slow CDN, firewall), the page uses system font fallbacks — no
      layout shift because display=optional means no font swap.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=optional"
      media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=optional">
    </noscript>
  </head>

  <body>
    <!-- Loading overlay — removed by main.tsx after React mount -->
    <div id="app-loader"><div class="spinner"></div></div>
    <div id="root"></div>
    <!-- SAFETY: Remove loading overlay even if JS modules fail to load.
         This runs BEFORE module loading, so it's guaranteed to execute.
         main.tsx normally removes it sooner (~3s); this is a fallback. -->
    <script>
      setTimeout(function() {
        var loader = document.getElementById('app-loader');
        if (loader) loader.remove();
        document.documentElement.style.backgroundColor = '';
        document.documentElement.classList.remove('no-transitions');
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics loaded AFTER page load event so it doesn't keep the
         browser loading indicator spinning (which causes perceived "jumping") -->
    <script>
      window.addEventListener('load', function() {
        var ep = '%VITE_ANALYTICS_ENDPOINT%';
        var id = '%VITE_ANALYTICS_WEBSITE_ID%';
        if (ep && id && ep.charAt(0) !== '%') {
          var s = document.createElement('script');
          s.src = ep + '/umami';
          s.dataset.websiteId = id;
          s.async = true;
          document.body.appendChild(s);
        }
        // Register Service Worker for PWA offline support
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        }
      });
    </script>
  </body>

</html>
