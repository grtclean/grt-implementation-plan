# GRT智能系统 Docker Compose 配置
# 版本: v1.3.77
# 用途: Local-First, Cloud-Ready 混合部署架构
# 支持: Windows 11 (WSL2), Linux, Cloud (US/DE/CN)

version: '3.8'

services:
  # ============================================
  # 核心应用服务 (Frontend + Backend)
  # ============================================
  grt-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - APP_REGION=${APP_REGION:-US}
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmjs.org}
    image: grt-system/api:${VERSION:-latest}
    container_name: grt-api
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_REGION=${APP_REGION:-US}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - GLOBAL_GATEWAY_URL=${GLOBAL_GATEWAY_URL}
      - DEFAULT_ORGANIZATION_ID=${DEFAULT_ORGANIZATION_ID:-grt-headquarters}
      # AI Service Configuration (Region-aware)
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - AI_SERVICE_ENDPOINT=${AI_SERVICE_ENDPOINT}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Cross-Node Sync Configuration
      - SYNC_ENABLED=${SYNC_ENABLED:-false}
      - SYNC_PEER_NODES=${SYNC_PEER_NODES:-}
      - SYNC_HMAC_SECRET=${SYNC_HMAC_SECRET:-}
      - SYNC_ORIGIN_NODE=${SYNC_ORIGIN_NODE:-}
      # Redis Configuration
      - REDIS_URL=redis://grt-redis:6379
    volumes:
      - ./config:/app/config:ro
      - grt-logs:/app/logs
      - grt-temp:/app/temp
      - grt-uploads:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - grt-network
    depends_on:
      grt-db:
        condition: service_healthy
      grt-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ============================================
  # PostgreSQL 数据库服务
  # ============================================
  grt-db:
    image: postgres:16-alpine
    container_name: grt-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-grt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-grt_system}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      # 数据持久化到宿主机，方便本地备份
      - ./data/pgdata:/var/lib/postgresql/data/pgdata
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - grt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grt} -d ${POSTGRES_DB:-grt_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M

  # ============================================
  # Redis 缓存服务
  # ============================================
  grt-redis:
    image: redis:7-alpine
    container_name: grt-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - grt-redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - grt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M

  # ============================================
  # AI引擎服务 (Ollama - 本地LLM)
  # ============================================
  grt-ollama:
    image: ollama/ollama:latest
    container_name: grt-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - grt-ollama-models:/root/.ollama
    networks:
      - grt-network
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
    profiles:
      - with-local-ai
    # GPU支持 (NVIDIA - 如可用请取消注释)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ============================================
  # 定时任务服务
  # ============================================
  grt-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.scheduler
    image: grt-system/scheduler:${VERSION:-latest}
    container_name: grt-scheduler
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_REGION=${APP_REGION:-US}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://grt-redis:6379
    volumes:
      - ./config:/app/config:ro
      - grt-logs:/app/logs
    networks:
      - grt-network
    depends_on:
      - grt-redis
      - grt-api
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # ============================================
  # 健康检查与监控服务
  # ============================================
  grt-health-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.monitor
    image: grt-system/health-monitor:${VERSION:-latest}
    container_name: grt-health-monitor
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-300}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
    volumes:
      - ./config:/app/config:ro
      - grt-logs:/app/logs
    networks:
      - grt-network
    depends_on:
      - grt-api
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # ============================================
  # 跨节点同步服务
  # ============================================
  grt-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    image: grt-system/sync:${VERSION:-latest}
    container_name: grt-sync
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - APP_REGION=${APP_REGION:-US}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://grt-redis:6379
      - SYNC_ENABLED=${SYNC_ENABLED:-false}
      - SYNC_PEER_NODES=${SYNC_PEER_NODES:-}
      - SYNC_HMAC_SECRET=${SYNC_HMAC_SECRET:-}
      - SYNC_ORIGIN_NODE=${SYNC_ORIGIN_NODE:-}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-300}
    volumes:
      - ./config:/app/config:ro
      - grt-logs:/app/logs
      - grt-sync-queue:/app/sync-queue
    networks:
      - grt-network
    depends_on:
      - grt-api
      - grt-redis
    profiles:
      - with-sync
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # ============================================
  # Nginx 反向代理 (生产环境)
  # ============================================
  grt-nginx:
    image: nginx:alpine
    container_name: grt-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - grt-logs:/var/log/nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - grt-network
    depends_on:
      - grt-api
    profiles:
      - production
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

# ============================================
# 网络配置
# ============================================
networks:
  grt-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================
# 数据卷配置
# ============================================
volumes:
  grt-redis-data:
    driver: local
  grt-logs:
    driver: local
  grt-temp:
    driver: local
  grt-uploads:
    driver: local
  grt-ollama-models:
    driver: local
  grt-sync-queue:
    driver: local
